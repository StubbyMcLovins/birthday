<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #1a0f2e;
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .card {
    width: 100%;
    max-width: 680px;
  }
  .invite-svg {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 24px;
    overflow: hidden;
  }
  .countdown-box {
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 224, 102, 0.4);
    border-radius: 16px;
    margin: 16px 0;
    padding: 20px 12px;
    text-align: center;
    backdrop-filter: blur(10px);
  }
  .countdown-label {
    color: #FFE066;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 12px;
    font-weight: 700;
  }
  .countdown-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .cd-cell { text-align: center; }
  .cd-num {
    color: #FFFFFF;
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
  }
  .cd-unit {
    color: #FFE066;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 4px;
    font-weight: 700;
  }
  .rsvp-section {
    text-align: center;
    margin-top: 16px;
  }
  .rsvp-btn {
    display: inline-block;
    background: linear-gradient(135deg, #FF6B35 0%, #EF476F 100%);
    color: #FFFFFF;
    text-decoration: none;
    padding: 18px 36px;
    border-radius: 50px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    box-shadow: 0 4px 20px rgba(239, 71, 111, 0.4);
    transition: transform 0.2s;
    font-family: Georgia, serif;
  }
  .rsvp-btn:active { transform: scale(0.96); }
  .rsvp-sub {
    color: #FFE066;
    font-size: 14px;
    margin-top: 12px;
    letter-spacing: 1px;
  }
  .rsvp-phone {
    color: #FFFFFF;
    font-size: 16px;
    margin-top: 6px;
    letter-spacing: 1px;
    font-weight: 700;
  }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .cd-num { font-size: 28px; }
    .rsvp-btn { padding: 16px 28px; font-size: 18px; }
  }
</style>
</head>

<script>
(function(){
  var target = new Date('2026-06-20T18:00:00').getTime();
  var d = document.getElementById('cd-days');
  var h = document.getElementById('cd-hours');
  var m = document.getElementById('cd-mins');
  var s = document.getElementById('cd-secs');
  function tick(){
    var diff = target - new Date().getTime();
    if(diff <= 0){
      d.textContent = '0'; h.textContent = '0'; m.textContent = '0'; s.textContent = '0';
      return;
    }
    d.textContent = Math.floor(diff / 86400000);
    h.textContent = Math.floor((diff % 86400000) / 3600000);
    m.textContent = Math.floor((diff % 3600000) / 60000);
    s.textContent = Math.floor((diff % 60000) / 1000);
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
